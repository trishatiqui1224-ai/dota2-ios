name: Build Dota 2 Mobile iOS IPA (Metal)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (default: v1.4-demo-ios)'
        required: false
        type: string
        default: 'v1.4-demo-ios'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build Dota 2 iOS IPA (arm64 + Metal)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Reassemble Large Data Chunks
        run: |
          python3 tools/reassemble_chunks.py unity_ios_project/ExportedProject/build_ios

      - name: Build Dota 2 iOS Archive
        run: |
          XCODE_PROJECT="unity_ios_project/ExportedProject/build_ios/Unity-iPhone.xcodeproj"
          mkdir -p build
          
          # Build archive with Xcode CLI targeting generic iOS (arm64)
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Unity-iPhone.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Unity-iPhone.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qr Dota2Mobile-unsigned.ipa Payload
          cp Dota2Mobile-unsigned.ipa Dota2Mobile.ipa
          ls -lh Dota2Mobile-unsigned.ipa Dota2Mobile.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dota2Mobile-iOS-unsigned-ipa
          path: build/Dota2Mobile-unsigned.ipa
          retention-days: 14

      - name: Determine Release Tag
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ "$TAG" = "main" ] || [ "$TAG" = "master" ] || [ -z "$TAG" ]; then
            TAG="v1.4-demo-ios"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release tag: $TAG"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > /tmp/release_notes.md
          ### Dota 2 Mobile v1.4 asset boot demo (unsigned IPA)

          This build packages the Shadow Fiend assets recovered from `Dota-2-Mobile-v1.4-APKVISION.apk` and opens the v1.4 launcher on iOS.

          - Builds with Unity 6000.6.7 and Apple Metal.
          - Play opens a standalone Shadow Fiend showcase stage with basic touch-to-move input.
          - The APK's recovered IL2CPP gameplay methods are stubs, so this build does not provide a complete match, abilities, or server simulation.
          - The IPA is unsigned and requires signing for installation on a standard iPhone or iPad.
          EOF

          echo "Publishing release $RELEASE_TAG..."
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG exists. Updating assets..."
            gh release upload "$RELEASE_TAG" build/Dota2Mobile-unsigned.ipa build/Dota2Mobile.ipa --clobber
            gh release edit "$RELEASE_TAG" --notes-file /tmp/release_notes.md
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" build/Dota2Mobile-unsigned.ipa build/Dota2Mobile.ipa \
              --title "Dota 2 Mobile iOS $RELEASE_TAG" \
              --notes-file /tmp/release_notes.md \
              --target "${{ github.sha }}"
          fi
